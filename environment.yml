name: cragb
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas=2.2.*
  - pyarrow=16.*
  - numpy=1.26.*
  - scipy=1.13.*      # T3.3: cragb.eval.bootstrap paired significance (Wilcoxon signed-rank)
  - pyyaml=6.*
  - tqdm=4.*
  - matplotlib=3.9.*
  - jupyter=1.*
  - pytest=8.*
  - requests=2.32.*
  - pillow=12.*        # T6.1: cragb.multimodal.photo_store decodes/verifies fetched review photos
  - pip
  - pip:
      - langdetect==1.0.9
      - python-dotenv==1.2.*
      - rank_bm25==0.2.*
      # T4b.6: cragb.eval.judge_validation's Cohen's kappa (quadratic-weighted) for
      # judge-vs-human agreement. Installs fine in the main environment (no Windows
      # MAX_PATH issue, unlike sentence-transformers -- PLAN.md §14.1).
      - scikit-learn==1.9.*
      # Dense retrieval (T2.5). On Windows, installing these into a
      # deeply-nested site-packages path (e.g. the Microsoft Store
      # Python's per-user install location) can hit MAX_PATH errors from
      # torch/transformers' bundled license files. If `pip install`
      # fails with "filename or extension is too long", either enable
      # Windows long-path support (see
      # https://pip.pypa.io/warnings/enable-long-paths, requires admin)
      # or install into a venv at a short path (e.g. `C:\venv\cragb`)
      # instead — both avoid the issue; this project's own dev
      # environment uses the latter.
      #
      # `torch` below installs the default (CPU) wheel. On a CUDA-capable
      # GPU (this project's dev machine: RTX 3050 Laptop, 4GB VRAM,
      # driver supports CUDA 12.7), install a matching CUDA build instead
      # for a ~10-20x encoding speedup — `DenseRetriever` auto-detects
      # and uses CUDA when available either way:
      #   pip install --index-url https://download.pytorch.org/whl/cu124 torch
      - torch
      - sentence-transformers
      - faiss-cpu
      #
      # Fine-tuning stack (T7.7; PLAN.md §10). Same MAX_PATH reasoning as the
      # dense-retrieval block above -- installed into `C:\venv\cragb`
      # (the same short-path venv, not this conda env, and not listed
      # under this file's own `pip:` section since a fresh `conda env
      # create -f environment.yml` in the *conda* env deliberately does
      # NOT pull these in). Versions actually installed there at T7.7
      # build time, for reproducibility:
      #   peft==0.20.0  accelerate==1.14.0  bitsandbytes==0.50.1
      #   datasets==5.0.1  trl==1.10.0
      # (transformers==5.14.1 and torch==2.6.0+cu124 were already present
      # from T2.5's dense-retrieval install, per that block's comment.)
      # `bitsandbytes` shipped official Windows wheels from 0.43 onward,
      # confirmed live at T7.7 build time: `pip install bitsandbytes` in
      # the venv resolved a `win_amd64` wheel directly, no MAX_PATH or
      # build-from-source issue at all -- unlike `sentence-transformers`
      # above, this one installed cleanly on the first attempt.
      # To reproduce: `C:\venv\cragb\Scripts\python.exe -m pip install
      # peft accelerate bitsandbytes datasets trl`.
