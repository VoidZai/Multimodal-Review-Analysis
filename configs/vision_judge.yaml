# Vision-evidence judge configuration (T6.2 provider half; T6.4 completes the
# prompt/rubric half). PLAN.md §3 E7, §8 G3, M6.md T6.2/T6.4.
#
# Provider: Gemini, not Groq. PLAN.md §14.4's live Groq catalog snapshot
# (2026-08-19, 13 models: gpt-oss-{20b,120b}, qwen3.6-27b, two compound
# agentic systems, two prompt-guard classifiers, TTS, Whisper) has no
# vision-capable model at all. Google AI Studio is the second free-tier
# provider PLAN.md §1.3 already names.
#
# Model: gemini-3.6-flash. gemini-2.5-flash (the choice T6.2's docs
# initially reasoned to from Google's pricing pages) turned out to be dead
# for this key: a live call returned HTTP 404 "This model
# models/gemini-2.5-flash is no longer available to new users. Please
# update your code to use models/gemini-3.6-flash" (confirmed live,
# 2026-08-24) -- the model still appears in ListModels but is not actually
# callable, so a docs page or a catalog listing is not sufficient
# verification on its own; a live generateContent call is (the same lesson
# PLAN.md §14.4 already applied to Groq's catalog). gemini-3.6-flash is
# Google's own named replacement, confirmed live to be multimodal and
# free-tier eligible. If this model is deprecated before the project's
# final report, only this file needs to change (cragb.generate.gemini_client
# has no version pinned in code).
#
# Live gotcha worth knowing before T6.4: gemini-3.6-flash spends part of
# maxOutputTokens on internal "thinking" tokens that never appear in
# `content` (usageMetadata.thoughtsTokenCount) -- unlike qwen3.6-27b's
# <think>...</think> (PLAN.md §14.4), which is visible and stripped, this
# reasoning is fully hidden but still consumes the same token budget. A
# max_tokens too small for question + thinking + a short JSON verdict
# silently returns `content: {}` (finishReason=MAX_TOKENS, zero text) --
# not an error, just an empty candidate GeminiResponseError correctly
# raises on. 300 was confirmed live to leave enough headroom for a short
# "OK." reply plus ~50 thinking tokens; T6.4's real judge prompt (a verdict
# JSON with a <=30-word rationale) should be tested live before trusting
# this budget, and raised if verdicts start coming back empty.

seed: 42

provider:
  name: gemini
  model: gemini-3.6-flash
  api_base: https://generativelanguage.googleapis.com/v1beta
  api_key_env: GOOGLE_API_KEY
  # Deterministic scoring, not creative generation -- same reasoning as
  # configs/judge.yaml's text judge (T4b.4): a vision judge that scores the
  # same pair differently on different runs would defeat T6.6's reliability
  # measurement.
  temperature: 0.0
  # The verdict JSON is small (winner + confidence + <=30-word rationale);
  # generous headroom in case a rationale runs long.
  max_tokens: 300
  timeout_s: 30
  max_retries: 5
  cache_dir: results/cache/api
  call_log_path: results/cache/api_calls_v1.jsonl
