# Chunking configuration (T3.1; PLAN.md §3 E2, M3.md T3.1).
#
# Three candidate schemes, compared with evidence (not assumed) by the
# chunking study in T3.4:
#   - whole_review:     one chunk per review — the corpus's natural unit.
#   - fixed_token:      reviews split into fixed-size, non-overlapping
#                        windows of `fixed_token_size` words (PLAN.md §3
#                        E2 calls for both 128 and 256 to be tried).
#   - sentence_window:   reviews split into non-overlapping windows of
#                        `sentence_window_size` sentences each.
#
# `scheme` below is the *active default* used by anything that loads this
# config directly (e.g. the retrieval eval harness, T3.5+, run without an
# explicit override).
#
# DECIDED (T3.4, notebooks/04_chunking_study.ipynb, results/tables/
# chunking_study_v1.csv): `whole_review` wins BM25 Recall@k at every
# k in {1,3,5,10} on all 58 scorable CRAGB v1 questions (200k-review
# corpus_v1), though it is statistically indistinguishable from
# fixed_token_256 (heavily overlapping 95% bootstrap CIs — splitting at
# 256 words barely touches most reviews, since only ~2.7% of corpus_v1
# exceeds 256 tokens). fixed_token_128 trails noticeably, and
# sentence_window_3 is the clear loser (~half whole_review's Recall@10:
# 0.246 vs 0.504) — 3-sentence windows fragment the exact keyword
# co-occurrences BM25 relies on in already-short review text. This
# confirms PLAN.md §3 E2's working hypothesis on real data rather than
# assuming it; `whole_review` is locked in for RQ2 (T3.6+) and every
# later retrieval eval, not provisional.

seed: 42

paths:
  corpus_in: data/processed/corpus_v1.parquet

chunking:
  scheme: whole_review          # one of: whole_review | fixed_token | sentence_window
  fixed_token_size: 256         # words per chunk, used when scheme == fixed_token
  sentence_window_size: 3       # sentences per chunk, used when scheme == sentence_window
